<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Demo floor plan for wifi-site-survey --demo mode. Rooms match demo_coords.csv. -->
  <rect x="0" y="0" width="800" height="600" fill="#f7f7f7" stroke="#999" stroke-width="4"/>
  <!-- Rooms -->
  <rect x="20" y="40" width="120" height="120" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <rect x="170" y="40" width="220" height="150" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <rect x="420" y="40" width="230" height="150" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <rect x="20" y="210" width="760" height="50" fill="#eeeeee" stroke="#555" stroke-width="2"/>
  <rect x="20" y="280" width="340" height="280" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <rect x="390" y="280" width="170" height="280" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <rect x="590" y="280" width="190" height="280" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <!-- Doors -->
  <line x1="80" y1="160" x2="110" y2="160" stroke="#f7f7f7" stroke-width="6"/>
  <line x1="280" y1="190" x2="310" y2="190" stroke="#f7f7f7" stroke-width="6"/>
  <line x1="535" y1="190" x2="565" y2="190" stroke="#f7f7f7" stroke-width="6"/>
  <line x1="190" y1="280" x2="220" y2="280" stroke="#f7f7f7" stroke-width="6"/>
  <line x1="475" y1="280" x2="505" y2="280" stroke="#f7f7f7" stroke-width="6"/>
  <line x1="685" y1="280" x2="715" y2="280" stroke="#f7f7f7" stroke-width="6"/>
  <!-- Labels -->
  <g font-family="system-ui,sans-serif" font-size="16" fill="#555" text-anchor="middle">
    <text x="80" y="105">Storage</text>
    <text x="280" y="110">Office 1</text>
    <text x="535" y="110">Office 2</text>
    <text x="400" y="242">Hallway</text>
    <text x="190" y="425">Lobby</text>
    <text x="475" y="425">Break Room</text>
    <text x="685" y="425">Warehouse</text>
  </g>
</svg>
